
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Medicine - Medical Store Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 30px;
        }

        .booking-container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #17365d;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        .selected {
            background: #eaf7f7;
            font-weight: bold;
        }

        .book-btn {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #087f8c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .book-btn:hover {
            background: #05636d;
        }

        .back-btn {
            display: inline-block;
            margin-top: 18px;
            color: #17365d;
            text-decoration: none;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
        }
    </style>
</head>
<script>
    const price = Number("{{ selected_medicine.price|default:0 }}");

    const quantityInput = document.querySelector(
        'input[name="quantity"]'
    );

    const totalAmount = document.getElementById("total_amount");

    quantityInput.addEventListener("input", function () {
        const quantity = Number(this.value) || 0;
        const total = price * quantity;

        totalAmount.value = "₹" + total.toFixed(2);
    });
</script>

<body>

<div class="booking-container">

    <h1>Book Medicine</h1>
    <p class="subtitle">Medical Store Management System</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if selected_medicine %}

        <form method="POST">
            {% csrf_token %}

            <label>Selected Medicine</label>

            <input
                type="text"
                class="selected"
                value="{{ selected_medicine.name }} - ₹{{ selected_medicine.price }}"
                readonly
            >
            
            <input
                type="hidden"
                name="medicine"
                value="{{ selected_medicine.id }}"
            >


            <label>Customer Name</label>
            <input type="text" name="customer_name" required>

            <label>Mobile Number</label>
            <input type="tel" name="mobile" required>

            <label>Email</label>
            <input type="email" name="email">

            <label>Address</label>
            <textarea name="address" required></textarea>

            <label>Quantity</label>
            <input type="number" name="quantity" min="1"
                   max="{{ selected_medicine.stock }}" required>
            <label>Total Amount</label>
<input type="text" id="total_amount" value="₹0.00" readonly>

            <button type="submit" class="book-btn">
                Confirm Booking
            </button>
        </form>

    {% else %}

        <p>Please select a medicine from the Available Medicines page.</p>

    {% endif %}

    <a href="{% url 'medicines' %}" class="back-btn">
        ← Back to Medicines
    </a>

</div>

</body>
</html>
